<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Adventure</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #10152e, #202d50);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    text-align: center;
    width: 95%;
    max-width: 500px;
}

h1 {
    color: #63f5bd;
    font-size: 36px;
    letter-spacing: 2px;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    margin: 20px 0;
    font-size: 20px;
}

#score {
    color: #63f5bd;
}

#points {
    color: #ffcc55;
}

#game {
    width: 100%;
    aspect-ratio: 1;
    background: #101b29;
    border: 5px solid #63f5bd;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    grid-template-rows: repeat(20, 1fr);
    overflow: hidden;
}

.cell {
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: clamp(9px, 3vw, 20px);
}

.snake {
    background: #42d99b;
    border-radius: 35%;
}

.head {
    background: transparent;
}

.food {
    background: transparent;
}

button {
    margin: 15px 5px;
    padding: 12px 25px;
    border: none;
    border-radius: 8px;
    background: #63f5bd;
    color: #10152e;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #ffcc55;
}

#message {
    font-size: 22px;
    color: #ff7070;
    font-weight: bold;
}

.controls {
    display: grid;
    grid-template-columns: repeat(3, 65px);
    justify-content: center;
    gap: 5px;
}

.controls button {
    margin: 2px;
    padding: 15px;
}

</style>
</head>

<body>

<div class="container">

<h1>🐍 SNAKE ADVENTURE</h1>

<div class="scoreboard">
    <div>SCORE: <span id="score">0</span></div>
    <div>POINTS: <span id="points">0</span></div>
</div>

<div id="game"></div>

<p id="message">Press START to play!</p>

<button onclick="startGame()">START / RESTART</button>

<div class="controls">
    <span></span>
    <button onclick="changeDirection('up')">⬆️</button>
    <span></span>
    <button onclick="changeDirection('left')">⬅️</button>
    <button onclick="changeDirection('down')">⬇️</button>
    <button onclick="changeDirection('right')">➡️</button>
</div>

</div>

<script>

const game = document.getElementById("game");

const scoreText = document.getElementById("score");
const pointsText = document.getElementById("points");
const message = document.getElementById("message");

const size = 20;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;
let timer;
let running = false;

const foods = ["🍎", "🍓", "🍇", "🍊", "🍉", "🍍"];

function draw() {

    game.innerHTML = "";

    for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {

            const cell = document.createElement("div");
            cell.className = "cell";

            const part = snake.find(
                p => p.x === x && p.y === y
            );

            if (part) {

                if (part === snake[0]) {
    cell.classList.add("head");
    cell.textContent = "🐍";

    const rotations = {
        up: "0deg",
        right: "90deg",
        down: "180deg",
        left: "270deg"
    };

    cell.style.transform = `rotate(${rotations[direction]})`;
                }
                } else {
                    cell.classList.add("snake");
                }

            }

            if (food.x === x && food.y === y) {
                cell.classList.add("food");
                cell.textContent = food.icon;
            }

            game.appendChild(cell);
        }
    }
}

function createFood() {

    let position;

    do {
        position = {
            x: Math.floor(Math.random() * size),
            y: Math.floor(Math.random() * size)
        };
    } while (
        snake.some(
            p => p.x === position.x && p.y === position.y
        )
    );

    position.icon = foods[
        Math.floor(Math.random() * foods.length)
    ];

    food = position;
}

function startGame() {

    clearInterval(timer);

    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    direction = "right";
    nextDirection = "right";

    score = 0;
    running = true;

    scoreText.textContent = 0;
    pointsText.textContent = 0;

    message.textContent = "Good luck!";

    createFood();
    draw();

    timer = setInterval(update, 140);
}

function changeDirection(newDirection) {

    const opposite = {
        up: "down",
        down: "up",
        left: "right",
        right: "left"
    };

    if (opposite[direction] !== newDirection) {
        nextDirection = newDirection;
    }
}

document.addEventListener("keydown", e => {

    const keys = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        w: "up",
        s: "down",
        a: "left",
        d: "right"
    };

    if (keys[e.key]) {
        e.preventDefault();
        changeDirection(keys[e.key]);
    }
});

function update() {

    if (!running) return;

    direction = nextDirection;

    let head = {...snake[0]};

    if (direction === "up") head.y--;
    if (direction === "down") head.y++;
    if (direction === "left") head.x--;
    if (direction === "right") head.x++;

    // Wall wrapping

    if (head.x < 0) head.x = size - 1;
    if (head.x >= size) head.x = 0;
    if (head.y < 0) head.y = size - 1;
    if (head.y >= size) head.y = 0;

    // Eating food

    const eating =
        head.x === food.x && head.y === food.y;

    const body = eating ? snake : snake.slice(0, -1);

    // Self collision

    if (
        body.some(
            p => p.x === head.x && p.y === head.y
        )
    ) {
        gameOver();
        return;
    }

    snake.unshift(head);

    if (eating) {

        score += 10;

        scoreText.textContent = score;
        pointsText.textContent = score / 10;

        createFood();

    } else {

        snake.pop();

    }

    draw();
}

function gameOver() {

    running = false;
    clearInterval(timer);

    message.textContent = "GAME OVER! Score: " + score;

}


</script>

</body>
</html>
